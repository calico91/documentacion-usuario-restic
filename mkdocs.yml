site_name: Manual de Usuario — Restic
site_description: Manual de usuario de la aplicación móvil Restic (POS para restaurantes y heladerías).
site_author: Equipo Restic

docs_dir: docs
use_directory_urls: true

theme:
  name: material
  language: es
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
  icon:
    repo: fontawesome/brands/git-alt

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Inicio: index.md
  - Prólogo:
      - Requisitos: requisitos.md
      - Roles y permisos: roles-permisos.md
  - Primeros pasos:
      - Instalación y actualización: instalacion-actualizacion.md
      - Configurar conexión al servidor: configurar-conexion.md
      - Iniciar sesión: iniciar-sesion.md
      - Cambiar contraseña: cambiar-contrasena.md
  - Operación diaria:
      - Tomar un pedido: tomar-pedido.md
      - Productos especiales: productos-especiales.md
      - Notas y cargos adicionales: notas-cargos.md
      - Gestionar pedidos abiertos: gestionar-pedidos.md
      - Comandas (cocina): comandas-cocina.md
      - Cobrar un pedido: cobrar-pedido.md
      - Precuenta y reimpresión de factura: precuenta-factura.md
  - Gestión de caja:
      - Apertura de turno: apertura-caja.md
      - Egresos de caja: egresos-caja.md
      - Cierre de caja: cierre-caja.md
      - Cierres pendientes y conciliación: cierres-pendientes.md
      - Historial de egresos: historial-egresos.md
  - Administración:
      - Menú y productos: menu-productos.md
      - Combos: combos-configuracion.md
      - Recetas de inventario: recetas-inventario.md
      - Mesas: mesas.md
      - Clientes: clientes.md
      - Usuarios: usuarios.md
      - Métodos de pago: metodos-pago.md
      - Inventario: inventario.md
      - Datos fiscales: datos-fiscales.md
      - Reportes de ventas: reportes.md
      - Zonas de impresión: zonas-impresion.md
  - Impresión:
      - Configurar impresora: impresora-configuracion.md
      - Tipos de tickets: tipos-tickets.md
  - Transversal:
      - Sincronización en tiempo real: tiempo-real.md
      - Solución de problemas: solucion-problemas.md